aid: kiki
name: Kiki
description: Kiki (Kikihub) is a location-based social networking and chat mobile app that connects people
  nearby for local friendships, dating, networking, and community conversations. Users join local chat
  rooms to discover people around them and start real conversations, meeting new friends and matches in
  their area. The app is available for iOS and Android. Kiki publishes no public API, developer portal,
  or documentation; this profile tracks the company within the API Evangelist network as a venture-backed
  (500 Global, a16z) consumer social lead awaiting any future developer surface.
